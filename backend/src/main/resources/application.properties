spring.application.name=backend

# Connexió a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/playpadel}
spring.datasource.username=${DB_USER:playpadel}
spring.datasource.password=${DB_PASSWORD:playpadel}

# JPA: Hibernate crea i actualitza les taules a partir de les classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

server.port=${PORT:8080}