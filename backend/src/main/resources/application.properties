spring.application.name=backend

# Connexió a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/playpadel}
spring.datasource.username=${DB_USER:playpadel}
spring.datasource.password=${DB_PASSWORD:playpadel}

# JPA: Hibernate crea i actualitza les taules a partir de les classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Mostrar el motiu dels errors a la resposta (útil per a l'app)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# JWT: clau de signatura (Base64) i durada del token
playpadel.jwt.secret=${JWT_SECRET:6+vh+pnXhAE12/fqE671wAztgaZJRUMMPNrk11bqQvRqDhvK1PvrwqfP2fP/4+/R}
playpadel.jwt.expiracio-minuts=${JWT_EXPIRATION_MINUTES:120}

server.port=${PORT:8080}