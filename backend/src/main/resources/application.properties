spring.application.name=backend

# Connexió a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/playpadel}
spring.datasource.username=${DB_USER:playpadel}
spring.datasource.password=${DB_PASSWORD:playpadel}

# JPA: l'esquema el crea Flyway, Hibernate només el valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: scripts SQL a src/main/resources/db/migration
spring.flyway.enabled=true

server.port=${PORT:8080}